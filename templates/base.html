<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MostraTalento{% endblock %}</title>
<meta name="theme-color" content="#1F3C99">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F3C99'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='800' text-anchor='middle' fill='%23C9D6EE'%3EM%3C/text%3E%3C/svg%3E">
{% block meta %}{% endblock %}
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>document.documentElement.className='js'</script>
</head>
<body>
<header class="topo">
  <a class="marca" href="{{ url_for('home') }}">Mostra<b>Talento</b></a>
  <nav class="menu">
    <a href="{{ url_for('minha_vitrine') }}"{% if request.endpoint in ('minha_vitrine','pronto','editar') %} aria-current="page"{% endif %}>Minha vitrine</a>
    <a href="{{ url_for('guia_mei') }}"{% if request.endpoint == 'guia_mei' %} aria-current="page"{% endif %}>Guia do MEI</a>
  </nav>
</header>
<main class="wrap {% block wrapclass %}{% endblock %}">
{% block content %}{% endblock %}
</main>
<footer class="rodape">MostraTalento · projeto de extensão (UNIFOR) · ODS 8</footer>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
