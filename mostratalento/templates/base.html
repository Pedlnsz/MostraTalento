<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MostraTalento{% endblock %}</title>
<meta name="theme-color" content="#0F4C5C">
{% block meta %}{% endblock %}
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>document.documentElement.className='js'</script>
</head>
<body>
<header class="topo">
  <a class="marca" href="{{ url_for('home') }}">Mostra<b>Talento</b></a>
  <nav><a href="{{ url_for('guia_mei') }}">Guia do MEI</a></nav>
</header>
<main class="wrap {% block wrapclass %}{% endblock %}">
{% block content %}{% endblock %}
</main>
<footer class="rodape">MostraTalento · projeto de extensão (UNIFOR) · ODS 8</footer>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
